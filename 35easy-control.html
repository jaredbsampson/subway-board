<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a1124" />
<title>35 Easy · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,500;0,700;0,800;1,500;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0a1124;
    --bg-elev:   #131b33;
    --bg-card:   #182142;
    --line:      #232c4d;
    --ink:       #f4f1e8;
    --ink-mute:  #aab1cb;
    --ink-dim:   #6a7298;
    --hot:       #ff3b6b;
    --go:        #25e088;
    --gold:      #ffba2e;
    --jared:     #4ea0ff;
    --brooke:    #ff79b8;
    --joint:     #ffba2e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding-bottom: 60px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(78,160,255,.10), transparent 60%),
      radial-gradient(600px 500px at 100% 110%, rgba(255,59,107,.06), transparent 60%);
    z-index: 0;
  }
  .frame {
    position: relative; z-index: 1;
    max-width: 540px;
    margin: 0 auto;
    padding: 22px 18px 32px;
  }

  /* ---------- BACK LINK ---------- */
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-decoration: none;
    margin-bottom: 16px;
    transition: color .2s;
  }
  .back:hover { color: var(--ink); }
  .back .arrow { font-size: 14px; line-height: 1; }

  /* ---------- HEADER ---------- */
  header {
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 12px;
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    line-height: .9;
    letter-spacing: .02em;
    margin: 0;
    transform: skewX(-6deg);
    color: var(--ink);
  }
  header h1 .easy { color: var(--hot); }
  header .live {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--hot);
    display: flex; align-items: center; gap: 6px;
    font-weight: 700;
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--hot);
    box-shadow: 0 0 0 0 var(--hot);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,59,107,.6); }
    70%  { box-shadow: 0 0 0 12px rgba(255,59,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,107,0); }
  }

  /* ---------- SCORE PANEL ---------- */
  .scorebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .score-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 14px;
    text-align: center;
  }
  .score-card .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    line-height: .9;
    color: var(--gold);
  }
  .score-card.progress .num { color: var(--ink); }
  .score-card.progress .num.complete { color: var(--go); }
  .score-card .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  /* ---------- WHO AM I PICKER ---------- */
  .picker {
    margin-bottom: 24px;
  }
  .picker h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 10px;
    font-weight: 500;
  }
  .picker .who-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .who-btn {
    appearance: none;
    background: var(--bg-card);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 16px 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: .04em;
    color: var(--ink-dim);
    cursor: pointer;
    transition: all .2s;
    text-transform: uppercase;
  }
  .who-btn.active.jared {
    border-color: var(--jared);
    color: var(--jared);
    box-shadow: inset 0 -4px 0 var(--jared);
  }
  .who-btn.active.brooke {
    border-color: var(--brooke);
    color: var(--brooke);
    box-shadow: inset 0 -4px 0 var(--brooke);
  }

  /* ---------- TOGGLE CARDS ---------- */
  section { margin-bottom: 20px; }
  section h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 10px;
    font-weight: 500;
  }
  .toggle {
    width: 100%;
    appearance: none;
    background: var(--bg-card);
    border: 2px solid var(--line);
    border-left-width: 6px;
    border-radius: 6px;
    padding: 16px 16px;
    text-align: left;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    color: var(--ink);
    transition: all .25s cubic-bezier(.2,.7,.2,1);
  }
  .toggle.j { border-left-color: var(--jared); }
  .toggle.b { border-left-color: var(--brooke); }
  .toggle.t { border-left-color: var(--joint); }
  .toggle.done { background: linear-gradient(90deg, rgba(37,224,136,.18), rgba(37,224,136,0) 70%), var(--bg-card); border-left-color: var(--go); }
  .toggle:active { transform: scale(.985); }

  .toggle .label-stack {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .toggle .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .toggle.j .who { color: var(--jared); }
  .toggle.b .who { color: var(--brooke); }
  .toggle.t .who { color: var(--joint); }
  .toggle .what {
    font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif;
    font-size: 28px;
    line-height: 1;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .toggle .quip {
    font-family: 'Barlow Condensed', sans-serif;
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    color: var(--ink-mute);
    line-height: 1.2;
  }
  .stamp {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: .08em;
    padding: 8px 14px;
    border: 2px solid var(--ink-dim);
    color: var(--ink-dim);
    border-radius: 4px;
    transform: skewX(-6deg);
    transition: all .25s cubic-bezier(.2,.7,.2,1);
    text-align: center;
    min-width: 78px;
    flex-shrink: 0;
  }
  .stamp::before { content: "OPEN"; }
  .toggle.done .stamp { color: var(--go); border-color: var(--go); }
  .toggle.done .stamp::before { content: "DONE"; }

  /* ---------- VICTORY ---------- */
  .victory {
    margin: 14px 0 4px;
    padding: 18px;
    text-align: center;
    background: linear-gradient(135deg, rgba(37,224,136,.18), rgba(255,186,46,.12));
    border: 2px solid var(--go);
    border-radius: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: .06em;
    color: var(--go);
    line-height: 1;
    transform: skewX(-6deg);
    display: none;
  }
  [data-complete="true"] .victory { display: block; }

  /* ---------- API CONFIG ---------- */
  .api-config {
    margin-top: 28px;
    padding: 12px;
    background: var(--bg-elev);
    border: 1px dashed var(--line);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .api-config input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    margin-top: 6px;
  }

  .saving {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 22px;
    border-radius: 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    transition: transform .25s;
    z-index: 100;
    font-weight: 700;
  }
  .saving.show { transform: translateX(-50%) translateY(0); }
  .saving.err  { background: var(--hot); color: var(--ink); }

  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 2px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-align: center;
  }
</style>
</head>
<body>

<div class="frame">
  <a class="back" href="index.html"><span class="arrow">←</span><span>Departures</span></a>

  <header>
    <h1><span>35</span> <span class="easy">EASY</span></h1>
    <div class="live"><span class="pulse"></span><span id="status">LIVE</span></div>
  </header>

  <div class="scorebar">
    <div class="score-card">
      <div class="num" id="streak-num">0</div>
      <div class="lbl">Day Streak</div>
    </div>
    <div class="score-card progress">
      <div class="num" id="progress-num">0/5</div>
      <div class="lbl">Today</div>
    </div>
  </div>

  <div class="picker">
    <h2>I Am</h2>
    <div class="who-buttons">
      <button class="who-btn jared"  data-who="jared">Jared</button>
      <button class="who-btn brooke" data-who="brooke">Brooke</button>
    </div>
  </div>

  <section id="my-section">
    <h2 id="my-heading">My Reps</h2>
    <button class="toggle" id="toggle-exercise">
      <div class="label-stack">
        <div class="who" id="my-name-1">—</div>
        <div class="what">Exercise Outside</div>
        <div class="quip">Move the body, anywhere but indoors.</div>
      </div>
      <div class="stamp"></div>
    </button>
    <button class="toggle" id="toggle-scripture">
      <div class="label-stack">
        <div class="who" id="my-name-2">—</div>
        <div class="what">Read Scripture</div>
        <div class="quip">One verse. Sit with it.</div>
      </div>
      <div class="stamp"></div>
    </button>
  </section>

  <section>
    <h2>Together</h2>
    <button class="toggle t" id="toggle-checkin">
      <div class="label-stack">
        <div class="who">Team Sampson</div>
        <div class="what">Check In With Each Other</div>
        <div class="quip">One real conversation. No phones. Just us.</div>
      </div>
      <div class="stamp"></div>
    </button>
  </section>

  <div class="victory">Day Owned</div>

  <div class="api-config">
    API URL (saved on this device)
    <input id="api-url" placeholder="https://subway-board-api.jared-b-sampson.workers.dev" />
  </div>

  <footer>NO. 35 · DAILY PRACTICE · TEAM SAMPSON</footer>
</div>

<div class="saving" id="saving">Saved</div>

<script>
const apiUrlInput = document.getElementById('api-url');
const DEFAULT_API = 'https://subway-board-api.jared-b-sampson.workers.dev';
let apiUrl = localStorage.getItem('subway-api-url') || DEFAULT_API;
if (!localStorage.getItem('subway-api-url')) localStorage.setItem('subway-api-url', apiUrl);
apiUrlInput.value = apiUrl;
apiUrlInput.addEventListener('change', () => {
  apiUrl = apiUrlInput.value.trim().replace(/\/+$/, '');
  localStorage.setItem('subway-api-url', apiUrl);
  load();
});

let me = localStorage.getItem('35easy-me') || ''; // 'jared' | 'brooke'
let state = { date: '', items: {}, streak: 0 };

const $ = id => document.getElementById(id);
function notify(text, isErr) {
  const el = $('saving');
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(notify._t);
  notify._t = setTimeout(() => el.classList.remove('show'), 1400);
}

function refreshPicker() {
  document.querySelectorAll('.who-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.who === me);
  });
  if (me) {
    const cap = me[0].toUpperCase() + me.slice(1);
    $('my-heading').textContent = `${cap}'s Reps`;
    $('my-name-1').textContent = cap;
    $('my-name-2').textContent = cap;
    document.getElementById('toggle-exercise').classList.remove('j','b');
    document.getElementById('toggle-scripture').classList.remove('j','b');
    document.getElementById('toggle-exercise').classList.add(me === 'jared' ? 'j' : 'b');
    document.getElementById('toggle-scripture').classList.add(me === 'jared' ? 'j' : 'b');
  } else {
    $('my-heading').textContent = 'Pick One Above';
    $('my-name-1').textContent = '—';
    $('my-name-2').textContent = '—';
  }
}

document.querySelectorAll('.who-btn').forEach(b => {
  b.addEventListener('click', () => {
    me = b.dataset.who;
    localStorage.setItem('35easy-me', me);
    refreshPicker();
    applyState();
  });
});

function applyState() {
  const ex = document.getElementById('toggle-exercise');
  const sc = document.getElementById('toggle-scripture');
  const ci = document.getElementById('toggle-checkin');

  const exKey = me ? `${me}_exercise` : null;
  const scKey = me ? `${me}_scripture` : null;

  ex.classList.toggle('done', !!(exKey && state.items?.[exKey]));
  sc.classList.toggle('done', !!(scKey && state.items?.[scKey]));
  ci.classList.toggle('done', !!state.items?.checkin);

  const streak = Number(state.streak || 0);
  $('streak-num').textContent = streak;

  const ITEMS = ['jared_exercise','jared_scripture','brooke_exercise','brooke_scripture','checkin'];
  const done = ITEMS.filter(k => state.items?.[k]).length;
  const pn = $('progress-num');
  pn.textContent = `${done}/5`;
  pn.classList.toggle('complete', done === 5);
  document.documentElement.dataset.complete = (done === 5) ? 'true' : '';
}

async function load() {
  if (!apiUrl) { $('status').textContent = 'NO API'; return; }
  try {
    const r = await fetch(apiUrl + '/35easy', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    applyState();
    $('status').textContent = 'LIVE';
  } catch (e) {
    $('status').textContent = 'OFFLINE';
  }
}

async function toggleItem(key) {
  if (!apiUrl) { notify('Set API URL first', true); return; }
  const current = !!state.items?.[key];
  const next = !current;
  // Optimistic flip
  state.items = { ...state.items, [key]: next };
  applyState();
  try {
    const r = await fetch(apiUrl + '/35easy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: key, value: next }),
    });
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    applyState();
    notify(next ? 'On The Board' : 'Removed');
  } catch (e) {
    // revert
    state.items[key] = current;
    applyState();
    notify('Save Failed', true);
  }
}

document.getElementById('toggle-exercise').addEventListener('click', () => {
  if (!me) { notify('Pick a player first', true); return; }
  toggleItem(`${me}_exercise`);
});
document.getElementById('toggle-scripture').addEventListener('click', () => {
  if (!me) { notify('Pick a player first', true); return; }
  toggleItem(`${me}_scripture`);
});
document.getElementById('toggle-checkin').addEventListener('click', () => {
  toggleItem('checkin');
});

refreshPicker();
load();
setInterval(load, 8000);   // keep it fresh if the other phone toggles
</script>
</body>
</html>
